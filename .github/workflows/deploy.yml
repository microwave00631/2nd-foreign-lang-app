name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/language-vocab-app-qnyfyp, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /2nd-foreign-lang-app/
          # 簡易パスコードの合言葉ハッシュ。リポジトリ変数 GATE_HASH で上書き可能。
          # 未設定なら下のデフォルト(合言葉: nihao-2026)を使う。
          VITE_GATE_HASH: ${{ vars.GATE_HASH || '0295df06327b5eda7b490dabc14eac970f6e4e4bd3fa1d81ccbac586c6107e3e' }}
      # SPA のディープリンク(/quiz 等)を Pages の 404 フォールバックで処理する
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
